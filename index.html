<!DOCTYPE html>
<html lang="uk">
<head>

    <title>FitLife Club</title>
    <link rel="icon" href="../media/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body>

    <header>
        <a href="#home">
            <img src="../media/logo.jpg">
        </a>

        <!-- КНОПКА БУРГЕРА -->
        <div class="burger" onclick="toggleMenu()">
            ☰
        </div>

        <nav class="nav" id="nav">
            <a href="index.html#home">Головна</a>
            <a href="programs.html#programs">Програми</a>
            <a href="index.html#contact">Контакти</a>
  
        </nav>
    </header>
    <!-- HERO -->
    <section class="hero" id="home">
        <div>
            <h1>Твоє нове тіло починається тут</h1>

        </div>

            <textarea name="message" placeholder="Повідомлення"></textarea>

            <button type="submit">Відправити</button>

        </form>
    </section>

    <footer>

    </footer>

    <script>
        function toggleMenu() {
            const nav = document.getElementById("nav");
            nav.classList.toggle("active");
        }
